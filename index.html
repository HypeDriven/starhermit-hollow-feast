<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="favicon.png" type="image/png">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hollow Feast</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; }
  body { margin: 0; background-color: #0b0d12; background-image: url('./assets/backdrop.webp'); background-size: cover; background-position: center; background-repeat: no-repeat; color: #e8ecf4; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; flex-direction: column; align-items: center; height: 100vh; height: 100dvh; }
  header { flex: none; padding: 12px 16px 0; text-align: center; }
  h1 { margin: 0; font-size: 28px; letter-spacing: 0.5px; color: #ffffff; }
  .subtitle { margin-top: 4px; font-size: 13px; color: #9aa7bd; }
  .howto { margin: 4px auto 0; max-width: 62ch; font-size: 13px; line-height: 1.35; color: #b9c6dc; }
  /* The playfield takes whatever height is left after the header, HUD and
     controls, so those never fall below the fold. The canvas is sized in
     game.js from this box and the camera is refit to keep the whole board
     in view at any aspect ratio. */
  #game-wrap { position: relative; flex: 1 1 auto; min-height: 140px; width: calc(100% - 32px); max-width: 1200px; margin-top: 8px; display: flex; align-items: center; justify-content: center; }
  #win-banner { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 10px 22px; border-radius: 12px; background: rgba(11, 13, 18, 0.82); border: 1px solid #f6e7b2; color: #f6e7b2; font-size: 22px; font-weight: 600; letter-spacing: 0.4px; pointer-events: none; text-align: center; max-width: 90%; }
  #win-banner[hidden] { display: none; }
  @media (prefers-reduced-motion: no-preference) { #win-banner { animation: hf-pop 220ms ease-out; } }
  @keyframes hf-pop { from { opacity: 0; transform: translate(-50%, -50%) scale(0.94); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
  canvas#game { display: block; background: #141a26; border-radius: 8px; touch-action: none; }
  .hud-row { flex: none; display: flex; gap: 16px; margin-top: 8px; font-size: 15px; color: #dfe7f3; text-align: center; }
  .hud-cell b { display: block; font-size: 20px; color: #ffffff; font-weight: 600; }
  #controls { flex: none; margin-top: 8px; padding-bottom: 12px; }
  button.ctl { width: 56px; height: 44px; border-radius: 9px; border: none; background: #233047; color: #ffffff; font-size: 18px; cursor: pointer; padding: 0; margin: 0; }
  button.ctl:hover { filter: brightness(1.15); }
  button.ctl:focus-visible { outline: 2px solid #6ea3ff; outline-offset: 1px; }
  @media (max-height: 520px) {
    header { padding-top: 6px; }
    h1 { font-size: 20px; }
    .subtitle { display: none; }
    .howto { font-size: 11px; margin-top: 2px; }
    #win-banner { font-size: 17px; padding: 8px 16px; }
    .hud-row { margin-top: 4px; font-size: 13px; }
    .hud-cell b { font-size: 16px; }
    #controls { margin-top: 4px; padding-bottom: 6px; }
    button.ctl { height: 36px; width: 50px; }
  }
</style>
</head>
<body>
<header>
  <h1>Hollow Feast</h1>
  <div class="subtitle" data-i18n="subtitle">Game index 56 &middot; collection action</div>
  <p class="howto" data-i18n="howto">Eat the glowing morsels in numbered order. Arrow keys, WASD, or the buttons below. R restarts.</p>
</header>
<div id="game-wrap">
  <canvas id="game" data-i18n-aria="playfield" aria-label="Hollow Feast playfield"></canvas>
  <div id="win-banner" role="status" data-i18n="win" hidden>Feast complete!</div>
</div>
<section class="hud-row" aria-live="polite">
  <div class="hud-cell"><span data-i18n="score">Score</span><b id="score">0</b></div>
  <div class="hud-cell"><span data-i18n="eaten">Eaten</span><b id="eaten">0 / 12</b></div>
</section>
<nav id="controls" data-i18n-aria="controls" aria-label="Game controls">
  <button type="button" class="ctl" data-dir="left" data-i18n-aria="moveLeft" aria-label="Move left">&#8592;</button>
  <button type="button" class="ctl" data-dir="up" data-i18n-aria="moveUp" aria-label="Move up">&#8593;</button>
  <button type="button" class="ctl" data-dir="down" data-i18n-aria="moveDown" aria-label="Move down">&#8595;</button>
  <button type="button" class="ctl" data-dir="right" data-i18n-aria="moveRight" aria-label="Move right">&#8594;</button>
  <button type="button" class="ctl" id="restart" data-i18n-aria="restart" aria-label="Restart round">&#8635;</button>
</nav>
<script src="./js/i18n.js"></script>
<script src="./rules.js"></script>
<script src="./js/sfx.js"></script>
<script type="module">
  import * as THREE from './js/three.module.min.js?v=feast-2';
  window.THREE = THREE;
  await import('./game.js?v=feast-2');
</script>
</body>
</html>
