<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hollow Feast</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; }
  body { margin: 0; background: #0b0d12; color: #e8ecf4; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; flex-direction: column; align-items: center; height: 100vh; height: 100dvh; }
  header { flex: none; padding: 12px 16px 0; text-align: center; }
  h1 { margin: 0; font-size: 28px; letter-spacing: 0.5px; color: #ffffff; }
  .subtitle { margin-top: 4px; font-size: 13px; color: #9aa7bd; }
  /* The playfield takes whatever height is left after the header, HUD and
     controls, so those never fall below the fold. The canvas is sized in
     game.js from this box and the camera is refit to keep the whole board
     in view at any aspect ratio. */
  #game-wrap { flex: 1 1 auto; min-height: 140px; width: calc(100% - 32px); max-width: 1200px; margin-top: 8px; display: flex; align-items: center; justify-content: center; }
  canvas#game { display: block; background: #141a26; border-radius: 8px; touch-action: none; }
  .hud-row { flex: none; display: flex; gap: 16px; margin-top: 8px; font-size: 15px; color: #dfe7f3; text-align: center; }
  .hud-cell b { display: block; font-size: 20px; color: #ffffff; font-weight: 600; }
  #controls { flex: none; margin-top: 8px; padding-bottom: 12px; }
  button.ctl { width: 56px; height: 44px; border-radius: 9px; border: none; background: #233047; color: #ffffff; font-size: 18px; cursor: pointer; padding: 0; margin: 0; }
  button.ctl:hover { filter: brightness(1.15); }
  button.ctl:focus-visible { outline: 2px solid #6ea3ff; outline-offset: 1px; }
  @media (max-height: 520px) {
    header { padding-top: 6px; }
    h1 { font-size: 20px; }
    .subtitle { display: none; }
    .hud-row { margin-top: 4px; font-size: 13px; }
    .hud-cell b { font-size: 16px; }
    #controls { margin-top: 4px; padding-bottom: 6px; }
    button.ctl { height: 36px; width: 50px; }
  }
</style>
</head>
<body>
<header><h1>Hollow Feast</h1><div class="subtitle">Game index 56 &middot; collection action</div></header>
<div id="game-wrap"><canvas id="game" aria-label="Hollow Feast playfield"></canvas></div>
<section class="hud-row" aria-live="polite">
  <div class="hud-cell"><span>Score</span><b id="score">0</b></div>
  <div class="hud-cell"><span>Eaten</span><b id="eaten">0 / 12</b></div>
</section>
<nav id="controls" aria-label="Game controls">
  <button type="button" class="ctl" data-dir="left" aria-label="Move left">&#8592;</button>
  <button type="button" class="ctl" data-dir="up" aria-label="Move up">&#8593;</button>
  <button type="button" class="ctl" data-dir="down" aria-label="Move down">&#8595;</button>
  <button type="button" class="ctl" data-dir="right" aria-label="Move right">&#8594;</button>
  <button type="button" class="ctl" id="restart" aria-label="Restart round">&#8635;</button>
</nav>
<script src="./rules.js"></script>
<script src="./js/sfx.js"></script>
<script type="module">
  import * as THREE from './js/three.module.min.js?v=fit-frame-1';
  window.THREE = THREE;
  await import('./game.js?v=fit-frame-1');
</script>
</body>
</html>
